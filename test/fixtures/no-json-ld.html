<!doctype html>
<html>
<head><title>Grandma's Cookies — Example Blog</title></head>
<body>
  <h1>Grandma's Cookies</h1>
  <p>A family favorite.</p>
  <h2>Ingredients</h2>
  <ul class="ingredient-list">
    <li>2 cups flour</li>
    <li>1 cup sugar</li>
    <li>1 cup butter</li>
  </ul>
  <h2>Instructions</h2>
  <ol class="instructions">
    <li>Cream butter and sugar.</li>
    <li>Add flour and mix.</li>
    <li>Bake at 350F for 12 minutes.</li>
  </ol>
</body>
</html>
